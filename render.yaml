# Blueprint de Render (referencia). Despliega cada microservicio desde su imagen
# en GHCR (publicada por GitHub Actions) con su propia base de datos PostgreSQL.
#
# Antes de usarlo:
#   1. Las imágenes apuntan a ghcr.io/javierlydiaz21-bit (dueño del repositorio, en minúsculas);
#      si el repositorio cambia de dueño, actualiza esa ruta en todas las líneas "image".
#   2. Crea en Render las credenciales de registro "ghcr" (usuario de GitHub + token con read:packages).
#   3. Revisa planes y región en el dashboard; los valores marcados `sync: false` se piden al aplicar.
#
# Solo el API Gateway y el Live Score Service (WebSocket de espectadores) son públicos;
# el resto son servicios privados (pserv) dentro de la red privada de Render.

envVarGroups:
  - name: sportsleague-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: LEAGUE_UTC_OFFSET
        value: "-05:00"
      - key: LEAGUE_TIMEZONE
        value: America/Bogota

services:
  - type: keyvalue
    name: sportsleague-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: sportsleague-api-gateway
    runtime: image
    image:
      url: ghcr.io/javierlydiaz21-bit/sportsleague-api-gateway:latest
      creds:
        fromRegistryCreds:
          name: ghcr
    plan: starter
    healthCheckPath: /health
    envVars:
      - fromGroup: sportsleague-shared
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false # p. ej. https://sportsleague.vercel.app
      - key: TRUST_PROXY
        value: "1"
      - key: REDIS_URL
        fromService: { type: keyvalue, name: sportsleague-redis, property: connectionString }
      - key: AUTH_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-auth-service, property: hostport }
      - key: LEAGUE_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-league-service, property: hostport }
      - key: TEAM_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-team-service, property: hostport }
      - key: FIXTURE_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-fixture-service, property: hostport }
      - key: REFEREE_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-referee-service, property: hostport }
      - key: LIVE_SCORE_SERVICE_URL
        fromService: { type: web, name: sportsleague-live-score-service, property: hostport }
      - key: STATISTICS_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-statistics-service, property: hostport }
      - key: NOTIFICATION_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-notification-service, property: hostport }
      - key: ANALYTICS_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-analytics-service, property: hostport }

  - type: pserv
    name: sportsleague-auth-service
    runtime: image
    image: { url: ghcr.io/javierlydiaz21-bit/sportsleague-auth-service:latest, creds: { fromRegistryCreds: { name: ghcr } } }
    plan: starter
    envVars:
      - fromGroup: sportsleague-shared
      - key: PORT
        value: "4001"
      - key: DATABASE_URL
        fromDatabase: { name: sportsleague-auth-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: sportsleague-redis, property: connectionString }
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none

  - type: pserv
    name: sportsleague-league-service
    runtime: image
    image: { url: ghcr.io/javierlydiaz21-bit/sportsleague-league-service:latest, creds: { fromRegistryCreds: { name: ghcr } } }
    plan: starter
    envVars:
      - fromGroup: sportsleague-shared
      - key: PORT
        value: "4002"
      - key: DATABASE_URL
        fromDatabase: { name: sportsleague-league-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: sportsleague-redis, property: connectionString }

  - type: pserv
    name: sportsleague-team-service
    runtime: image
    image: { url: ghcr.io/javierlydiaz21-bit/sportsleague-team-service:latest, creds: { fromRegistryCreds: { name: ghcr } } }
    plan: starter
    envVars:
      - fromGroup: sportsleague-shared
      - key: PORT
        value: "4003"
      - key: DATABASE_URL
        fromDatabase: { name: sportsleague-team-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: sportsleague-redis, property: connectionString }
      - key: LEAGUE_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-league-service, property: hostport }

  - type: pserv
    name: sportsleague-fixture-service
    runtime: image
    image: { url: ghcr.io/javierlydiaz21-bit/sportsleague-fixture-service:latest, creds: { fromRegistryCreds: { name: ghcr } } }
    plan: starter
    envVars:
      - fromGroup: sportsleague-shared
      - key: PORT
        value: "4004"
      - key: DATABASE_URL
        fromDatabase: { name: sportsleague-fixture-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: sportsleague-redis, property: connectionString }
      - key: LEAGUE_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-league-service, property: hostport }
      - key: TEAM_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-team-service, property: hostport }

  - type: pserv
    name: sportsleague-referee-service
    runtime: image
    image: { url: ghcr.io/javierlydiaz21-bit/sportsleague-referee-service:latest, creds: { fromRegistryCreds: { name: ghcr } } }
    plan: starter
    envVars:
      - fromGroup: sportsleague-shared
      - key: PORT
        value: "4005"
      - key: DATABASE_URL
        fromDatabase: { name: sportsleague-referee-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: sportsleague-redis, property: connectionString }

  - type: web
    name: sportsleague-live-score-service
    runtime: image
    image: { url: ghcr.io/javierlydiaz21-bit/sportsleague-live-score-service:latest, creds: { fromRegistryCreds: { name: ghcr } } }
    plan: starter
    healthCheckPath: /health
    envVars:
      - fromGroup: sportsleague-shared
      - key: PORT
        value: "4006"
      - key: DATABASE_URL
        fromDatabase: { name: sportsleague-livescore-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: sportsleague-redis, property: connectionString }
      - key: FIXTURE_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-fixture-service, property: hostport }
      - key: REFEREE_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-referee-service, property: hostport }
      - key: TEAM_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-team-service, property: hostport }
      - key: WS_ALLOWED_ORIGINS
        sync: false # p. ej. https://sportsleague.vercel.app

  - type: pserv
    name: sportsleague-statistics-service
    runtime: image
    image: { url: ghcr.io/javierlydiaz21-bit/sportsleague-statistics-service:latest, creds: { fromRegistryCreds: { name: ghcr } } }
    plan: starter
    envVars:
      - fromGroup: sportsleague-shared
      - key: PORT
        value: "4007"
      - key: DATABASE_URL
        fromDatabase: { name: sportsleague-statistics-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: sportsleague-redis, property: connectionString }
      - key: LEAGUE_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-league-service, property: hostport }
      - key: LIVE_SCORE_SERVICE_URL
        fromService: { type: web, name: sportsleague-live-score-service, property: hostport }

  - type: pserv
    name: sportsleague-notification-service
    runtime: image
    image: { url: ghcr.io/javierlydiaz21-bit/sportsleague-notification-service:latest, creds: { fromRegistryCreds: { name: ghcr } } }
    plan: starter
    envVars:
      - fromGroup: sportsleague-shared
      - key: PORT
        value: "4008"
      - key: DATABASE_URL
        fromDatabase: { name: sportsleague-notification-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: sportsleague-redis, property: connectionString }
      - key: TEAM_SERVICE_URL
        fromService: { type: pserv, name: sportsleague-team-service, property: hostport }

  - type: pserv
    name: sportsleague-analytics-service
    runtime: image
    image: { url: ghcr.io/javierlydiaz21-bit/sportsleague-analytics-service:latest, creds: { fromRegistryCreds: { name: ghcr } } }
    plan: starter
    envVars:
      - fromGroup: sportsleague-shared
      - key: PORT
        value: "4009"
      - key: DATABASE_URL
        fromDatabase: { name: sportsleague-analytics-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: sportsleague-redis, property: connectionString }
      # Cadenas de conexión de las réplicas de solo lectura (Render > base de datos > Read Replicas)
      - key: FIXTURE_REPLICA_URL
        sync: false
      - key: LIVESCORE_REPLICA_URL
        sync: false
      - key: STATISTICS_REPLICA_URL
        sync: false

databases:
  - { name: sportsleague-auth-db, databaseName: auth_db, user: auth_user, plan: basic-256mb }
  - { name: sportsleague-league-db, databaseName: league_db, user: league_user, plan: basic-256mb }
  - { name: sportsleague-team-db, databaseName: team_db, user: team_user, plan: basic-256mb }
  - { name: sportsleague-fixture-db, databaseName: fixture_db, user: fixture_user, plan: basic-256mb }
  - { name: sportsleague-referee-db, databaseName: referee_db, user: referee_user, plan: basic-256mb }
  - { name: sportsleague-livescore-db, databaseName: livescore_db, user: livescore_user, plan: basic-256mb }
  - { name: sportsleague-statistics-db, databaseName: statistics_db, user: statistics_user, plan: basic-256mb }
  - { name: sportsleague-notification-db, databaseName: notification_db, user: notification_user, plan: basic-256mb }
  - { name: sportsleague-analytics-db, databaseName: analytics_db, user: analytics_user, plan: basic-256mb }
