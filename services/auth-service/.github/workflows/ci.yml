# CI del repositorio independiente de auth-service. No copia los pasos: usa el workflow compartido
# ci-servicio.yml del repositorio principal (javierlydiaz21-bit/sportsleague) en su versión v1,
# el mismo que se ejecuta allí antes de publicar la imagen que despliega Render.
# Jobs: «Lint, pruebas y build», «Escaneo de secretos» (gitleaks) e «Imagen Docker».
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: javierlydiaz21-bit/sportsleague/.github/workflows/ci-servicio.yml@v1
