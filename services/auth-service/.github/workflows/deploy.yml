# Despliegue continuo de este microservicio. Corre en cada push a main (el merge de un Pull Request):
#   1. CI: lint, pruebas unitarias y de integración, cobertura y escaneo de secretos (ci-servicio.yml@v1).
#   2. Solo si el CI pasa: publica la imagen del commit en GHCR y la despliega en Render con su deploy hook.
# Si una prueba falla, el despliegue no se ejecuta. Si falta el secreto RENDER_DEPLOY_HOOK, el despliegue
# falla en vez de omitirse.
name: Despliegue continuo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: javierlydiaz21-bit/sportsleague/.github/workflows/ci-servicio.yml@v1
    with:
      docker: false # la imagen la construye y publica el job de despliegue

  deploy:
    name: Despliegue en Render
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write # publica en ghcr.io/<dueño>/sportsleague-app-<servicio>, la imagen que usa Render
    steps:
      - name: Comprobar que existe el deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Falta el secreto RENDER_DEPLOY_HOOK: no se puede desplegar."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Repositorio sportsleague-<servicio> → paquete sportsleague-app-<servicio>.
      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sportsleague-app-${GITHUB_REPOSITORY#*/sportsleague-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del commit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Desplegar en Render la imagen del commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -fsS -o /dev/null -X POST "${HOOK}&imgURL=$(jq -rn --arg v "$IMAGE:$GITHUB_SHA" '$v|@uri')"
          echo "Render desplegará $IMAGE:$GITHUB_SHA con rolling update (health check en /health)."
