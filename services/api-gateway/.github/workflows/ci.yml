# CI del repositorio independiente de api-gateway. No copia los pasos: usa el workflow compartido
# ci-servicio.yml del repositorio principal (javierlydiaz21-bit/sportsleague) en su versión v1.
# Jobs: «Lint, pruebas y build», «Escaneo de secretos» (gitleaks) e «Imagen Docker».
# En main no corre en push: allí lo ejecuta deploy.yml antes de desplegar.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: javierlydiaz21-bit/sportsleague/.github/workflows/ci-servicio.yml@v1
