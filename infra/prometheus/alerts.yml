groups:
  - name: sportsleague
    rules:
      - alert: MicroservicioCaido
        expr: up{job="sportsleague"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} no responde"
          description: "Prometheus no puede leer las métricas de {{ $labels.instance }} desde hace más de 1 minuto."

      - alert: TasaDeErroresAlta
        expr: sum by (service) (rate(http_requests_total{status=~"5.."}[5m])) / sum by (service) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Más del 5 % de errores en {{ $labels.service }}"

      - alert: GatewayLento
        expr: histogram_quantile(0.95, sum by (le) (rate(gateway_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "El p95 del API Gateway supera 1 s durante la jornada"

      - alert: MarcadorEnVivoConLatencia
        expr: histogram_quantile(0.95, sum by (le) (rate(live_score_update_latency_seconds_bucket[5m]))) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "El marcador en vivo tarda más de 500 ms (p95) en llegar a los espectadores"

      - alert: LiveScoreSaturado
        expr: rate(process_cpu_seconds_total{service="live-score-service"}[2m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de CPU alto en Live Score: considera escalar horizontalmente"

      - alert: CircuitoAbierto
        expr: max by (service, target) (circuit_breaker_state) == 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} abrió el circuito hacia {{ $labels.target }}"
