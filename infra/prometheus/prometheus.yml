global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sportsleague
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:4000
          - auth-service:4001
          - league-service:4002
          - team-service:4003
          - fixture-service:4004
          - referee-service:4005
          - live-score-service:4006
          - statistics-service:4007
          - notification-service:4008
          - analytics-service:4009
