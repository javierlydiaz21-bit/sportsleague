name: live-score-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/live-score-service/**'
      - '.github/workflows/live-score-service.yml'
      - '.github/workflows/service-pipeline.yml'
      - 'load-tests/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/live-score-service/**'
      - 'load-tests/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: live-score-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/service-pipeline.yml
    with:
      service: live-score-service
      load-test: true
    secrets:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_LIVE_SCORE }}
