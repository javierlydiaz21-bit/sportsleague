# Pipeline reutilizable: cada microservicio lo invoca con su propio workflow, así cada servicio se
# prueba de forma independiente. La calidad (lint, pruebas, build, escaneo de secretos e imagen Docker
# sin publicar) la hace ci-servicio.yml, el mismo workflow que usan los repositorios de cada servicio.
# Este repositorio no publica imágenes ni despliega: lo hace el deploy.yml de cada repositorio de
# servicio (sportsleague-<servicio>), para que nada se despliegue dos veces.
name: service-pipeline

on:
  workflow_call:
    inputs:
      service:
        description: Carpeta del microservicio dentro de services/
        required: true
        type: string
      load-test:
        description: Ejecutar las pruebas de carga con k6 (Live Score Service)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-servicio.yml
    with:
      path: services/${{ inputs.service }}
      docker: true

  load-test:
    name: Pruebas de carga (k6)
    if: inputs.load-test
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Levantar Live Score Service con PostgreSQL y Redis
        run: docker compose up -d --build --wait postgres redis live-score-service

      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      - name: Simular varias jornadas jugándose en simultáneo
        run: k6 run load-tests/live-score.js -e LIVE_URL=http://localhost:4006 -e INTERNAL_API_TOKEN=dev-internal-token-change-me

      - name: Logs del servicio
        if: always()
        run: docker compose logs live-score-service --tail 200

      - name: Apagar entorno
        if: always()
        run: docker compose down -v
