# Pipeline reutilizable: cada microservicio lo invoca con su propio workflow,
# así cada servicio se prueba, empaqueta y despliega de forma independiente.
# La calidad (lint, pruebas, build y escaneo de secretos) la hace ci-servicio.yml, el mismo
# workflow que usan los repositorios de cada servicio.
name: service-pipeline

on:
  workflow_call:
    inputs:
      service:
        description: Carpeta del microservicio dentro de services/
        required: true
        type: string
      load-test:
        description: Ejecutar las pruebas de carga con k6 (Live Score Service)
        required: false
        type: boolean
        default: false
    secrets:
      RENDER_DEPLOY_HOOK:
        required: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-servicio.yml
    with:
      path: services/${{ inputs.service }}
      docker: false

  load-test:
    name: Pruebas de carga (k6)
    if: inputs.load-test
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Levantar Live Score Service con PostgreSQL y Redis
        run: docker compose up -d --build --wait postgres redis live-score-service

      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      - name: Simular varias jornadas jugándose en simultáneo
        run: k6 run load-tests/live-score.js -e LIVE_URL=http://localhost:4006 -e INTERNAL_API_TOKEN=dev-internal-token-change-me

      - name: Logs del servicio
        if: always()
        run: docker compose logs live-score-service --tail 200

      - name: Apagar entorno
        if: always()
        run: docker compose down -v

  image:
    name: Imagen Docker → GHCR
    needs: [ci, load-test]
    if: always() && needs.ci.result == 'success' && needs.load-test.result != 'failure' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # el único job que publica: la imagen en GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Prefijo "sportsleague-app-": los nombres "sportsleague-<servicio>" ya pertenecen a los
      # paquetes del proyecto anterior (sportsleague-ms) y este repositorio no puede escribir en ellos.
      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sportsleague-app-${{ inputs.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ inputs.service }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

  deploy:
    name: Despliegue en Render (rolling update)
    needs: image
    # Sin una función de estado, GitHub aplica success() implícito sobre TODOS los jobs anteriores,
    # y el job de k6 (que solo corre en Live Score) queda "skipped": el despliegue se saltaría.
    if: ${{ !cancelled() && needs.image.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      # Único paso que lee el secreto: el deploy hook de Render de este servicio.
      - name: Desplegar la imagen versionada
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          SERVICE: ${{ inputs.service }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK no está configurado: se omite el despliegue."
            exit 0
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sportsleague-app-${SERVICE}:${GITHUB_SHA}"
          curl -fsS -o /dev/null -X POST "${HOOK}&imgURL=$(jq -rn --arg v "$IMAGE" '$v|@uri')"
          echo "Render desplegará $IMAGE con rolling update (health check en /health)."
