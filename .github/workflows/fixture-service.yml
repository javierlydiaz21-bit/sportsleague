name: fixture-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/fixture-service/**'
      - '.github/workflows/fixture-service.yml'
      - '.github/workflows/service-pipeline.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/fixture-service/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: fixture-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/service-pipeline.yml
    with:
      service: fixture-service
    secrets:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FIXTURE }}
