name: referee-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/referee-service/**'
      - '.github/workflows/referee-service.yml'
      - '.github/workflows/service-pipeline.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/referee-service/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: referee-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/service-pipeline.yml
    with:
      service: referee-service
    secrets:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_REFEREE }}
