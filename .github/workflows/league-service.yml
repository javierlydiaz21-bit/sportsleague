name: league-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/league-service/**'
      - '.github/workflows/league-service.yml'
      - '.github/workflows/service-pipeline.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/league-service/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: league-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/service-pipeline.yml
    with:
      service: league-service
    secrets:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_LEAGUE }}
