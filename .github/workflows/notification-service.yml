name: notification-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/notification-service/**'
      - '.github/workflows/notification-service.yml'
      - '.github/workflows/service-pipeline.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/notification-service/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: notification-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/service-pipeline.yml
    with:
      service: notification-service
    secrets:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_NOTIFICATION }}
