name: statistics-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/statistics-service/**'
      - '.github/workflows/statistics-service.yml'
      - '.github/workflows/service-pipeline.yml'
      - '.github/workflows/ci-servicio.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/statistics-service/**'
      - '.github/workflows/service-pipeline.yml'
      - '.github/workflows/ci-servicio.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: statistics-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/service-pipeline.yml
    with:
      service: statistics-service
    secrets:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STATISTICS }}
