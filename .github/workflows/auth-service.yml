name: auth-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service.yml'
      - '.github/workflows/service-pipeline.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/auth-service/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: auth-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/service-pipeline.yml
    with:
      service: auth-service
    secrets:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_AUTH }}
